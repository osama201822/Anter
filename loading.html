<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جاري التحميل</title>

<!-- ===== Google Fonts: Montserrat + Zain ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-color: #f4f7fa;
        --text-color: #1B2A4A;
        --primary-orange: #EF7910;
        --primary-teal: #03A9AA;
        --primary-blue: #052C51;

        /* Golden ratio constants */
        --phi: 1.618;
        --phi-inv: 0.618;

        /* Base logo width — scales responsively */
        --logo-width: clamp(100px, 26vw, 160px);

        /* Golden‑ratio derived sizes for the brand lockup */
        --font-en: calc(var(--logo-width) * 0.136);          /* ≈ logo-width / (φ * 4.55) */
        --font-ar: calc(var(--font-en) * var(--phi-inv));    /* smaller by φ⁻¹ */
        --gap-text: calc(var(--font-en) * 0.382);            /* φ⁻² approx */
        --gap-logo-text: calc(var(--logo-width) * 0.08);     /* 8% of logo width */
    }

    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
    }

    html, body {
        height: 100%;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--bg-color);
        font-family: 'Zain', 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        padding: 16px;
    }

    /* =========================================
       Container — mobile first
       ========================================= */
    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 640px;
    }

    .logo-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    /* =========================================
       Logo — golden‑ratio sized
       ========================================= */
    .logo-svg {
        width: var(--logo-width);
        height: auto;
        display: block;
        animation: logo-fade-in 0.7s ease-out 0s both;
    }

    @keyframes logo-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    /* =========================================
       Brand text — MASNAEY + مَصنَعِي
       Golden‑ratio proportions
       ========================================= */
    .brand-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap-text);
        margin-top: var(--gap-logo-text);
        opacity: 0;
        animation: brand-fade-in 0.9s cubic-bezier(0.25, 1, 0.5, 1) 1.8s forwards;
    }

    .brand-en {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: var(--font-en);
        letter-spacing: 0.12em;
        color: var(--primary-blue);
        line-height: 1.1;
        text-transform: uppercase;
    }

    .brand-ar {
        font-family: 'Zain', sans-serif;
        font-weight: 700;
        font-size: var(--font-ar);
        color: var(--primary-teal);
        line-height: 1.2;
        letter-spacing: 0.02em;
    }

    @keyframes brand-fade-in {
        0%   { opacity: 0; transform: translateY(16px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0);   filter: blur(0); }
    }

    /* =========================================
       Blue swoosh — appears last
       ========================================= */
    .blue-swoosh {
        opacity: 0;
        animation: fade-in-soft 0.6s ease-out 1.8s forwards;
    }

    /* =========================================
       Top gear — appears first & spins
       ========================================= */
    .top-gear-spin {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation:
            top-gear-fade-in 0.5s ease-out 0.2s forwards,
            top-gear-spin    2.2s cubic-bezier(0.15, 0.85, 0.25, 1) 0.3s both;
        will-change: transform;
    }

    @keyframes fade-in-soft {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes top-gear-fade-in {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes top-gear-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(1080deg); }
    }

    /* =========================================
       Orange gear — assembles in
       ========================================= */
    .gear-orange {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble-orange 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1.3s forwards;
    }

    /* =========================================
       Teal gear — assembles in
       ========================================= */
    .gear-teal {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble-teal 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards;
    }

    @keyframes assemble-orange {
        0%   { opacity: 0; transform: translate(140px, -70px) rotate(-140deg) scale(0.4); }
        65%  { opacity: 1; transform: translate(-8px, 4px) rotate(8deg) scale(1.06); }
        85%  { transform: translate(3px, -2px) rotate(-3deg) scale(0.98); }
        100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @keyframes assemble-teal {
        0%   { opacity: 0; transform: translate(-140px, 70px) rotate(140deg) scale(0.4); }
        65%  { opacity: 1; transform: translate(8px, -4px) rotate(-8deg) scale(1.06); }
        85%  { transform: translate(-3px, 2px) rotate(3deg) scale(0.98); }
        100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    /* =========================================
       Loading text
       ========================================= */
    .loading-text {
        margin: 18px 0 0;
        font-family: 'Zain', sans-serif;
        font-size: clamp(13px, 3.5vw, 16px);
        font-weight: 700;
        color: var(--text-color);
        opacity: 0;
        animation: fade-in-text 0.7s ease-out 3.0s forwards;
    }

    .dots-anim { display: inline-block; margin-inline-start: 2px; }
    .dots-anim i {
        font-style: normal;
        opacity: 0;
        animation: dot-blink 1.4s ease-in-out infinite;
    }
    .dots-anim i:nth-child(1) { animation-delay: 0s; }
    .dots-anim i:nth-child(2) { animation-delay: 0.18s; }
    .dots-anim i:nth-child(3) { animation-delay: 0.36s; }

    @keyframes fade-in-text {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes dot-blink {
        0%, 20% { opacity: 0; }
        50%     { opacity: 1; }
        80%, 100% { opacity: 0; }
    }

    /* =========================================
       Progress bar
       ========================================= */
    .progress-track {
        margin-top: 14px;
        width: min(50vw, 160px);
        height: 4px;
        border-radius: 99px;
        background: rgba(5, 44, 81, 0.08);
        overflow: hidden;
        opacity: 0;
        animation: fade-in-text 0.7s ease-out 3.2s forwards;
    }

    .progress-bar {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary-teal), var(--primary-orange));
        animation: indeterminate 1.7s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
    }

    @keyframes indeterminate {
        0%   { transform: translateX(320%); }
        100% { transform: translateX(-130%); }
    }

    /* =========================================
       Replay button — responsive
       ========================================= */
    .replay-btn {
        position: fixed;
        bottom: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        inset-inline-start: 16px;
        background: var(--primary-blue);
        color: #fff;
        border: 0;
        padding: 10px 18px;
        border-radius: 99px;
        font-family: 'Zain', sans-serif;
        font-size: clamp(11px, 3vw, 13px);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(5, 44, 81, 0.28);
        transition: transform .25s ease, background .25s ease;
        z-index: 100;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .replay-btn:hover  { background: var(--primary-teal); transform: translateY(-3px); }
    .replay-btn:active { transform: translateY(0) scale(.96); }
    .replay-btn svg    { width: 14px; height: 14px; flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) {
        .top-gear-spin { animation-duration: 0.8s, 0.8s; }
        .gear-orange,
        .gear-teal     { animation-duration: 0.8s; }
        .logo-svg      { animation: logo-fade-in 0.4s ease-out both; }
        .brand-text    { animation-duration: 0.5s; }
    }
</style>
</head>

<button class="replay-btn" onclick="replayAnimations()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <path d="M3 4v5h5"/>
    </svg>
    إعادة الحركة
</button>

<script>
    function replayAnimations() {
        const wrap = document.querySelector('.loader-container');
        const clone = wrap.cloneNode(true);
        wrap.parentNode.replaceChild(clone, wrap);
        document.querySelector('.replay-btn').onclick = replayAnimations;
    }
</script>

</body>
</html>
