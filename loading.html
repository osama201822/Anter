<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحميل - مصنعي</title>
<style>
    :root {
        --bg-color: #f4f7fa;
        --text-color: #1B2A4A;
        --primary-orange: #EF7910;
        --primary-teal: #03A9AA;
        --primary-blue: #052C51;
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        min-height: 100vh; min-height: 100dvh;
        background-color: var(--bg-color);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
    }

    .loader-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; max-width: 440px; padding: 20px;
    }

    .logo-wrapper {
        display: flex; justify-content: center; align-items: center;
        width: 100%;
    }

    /* =========================================
       Logo SVG — يظهر بتلاشٍ ناعم
       ========================================= */
    .logo-svg {
        width: 320px; height: auto;
        animation: logo-fade-in 0.7s ease-out 0s both;
    }
    @keyframes logo-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    /* =========================================
       الترس العلوي — يظهر أولاً ويدور
       ========================================= */

    /* القوس الأزرق (قاعدة الترس) — يظهر متأخراً مع باقي الشعار */
    .blue-swoosh {
        opacity: 0;
        animation: fade-in-soft 0.6s ease-out 1.8s forwards;
    }

    /* رأس الترس (الدوائر فقط) — يظهر أولاً ويلف */
    .top-gear-spin {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 50% 16.4%;  /* مركز الترس في إحداثيات viewBox */
        animation:
            top-gear-fade-in 0.5s ease-out 0.2s forwards,
            top-gear-spin    2.2s cubic-bezier(0.15, 0.85, 0.25, 1) 0.3s both;
        will-change: transform;
    }

    @keyframes fade-in-soft {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes top-gear-fade-in {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }

    /* 3 لفات كاملة مع تباطؤ تدريجي (بدون ارتداد — توقف نظيف) */
    @keyframes top-gear-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(1080deg); }
    }

    /* =========================================
       الترسان الآخران — يلتحمان بعد بدء الدوران
       ========================================= */
    .gear-orange {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble-orange 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1.3s forwards;
    }

    .gear-teal {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble-teal 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards;
    }

    @keyframes assemble-orange {
        0%   { opacity: 0; transform: translate(140px, -70px) rotate(-140deg) scale(0.4); }
        65%  { opacity: 1; transform: translate(-8px, 4px) rotate(8deg) scale(1.06); }
        85%  { transform: translate(3px, -2px) rotate(-3deg) scale(0.98); }
        100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @keyframes assemble-teal {
        0%   { opacity: 0; transform: translate(-140px, 70px) rotate(140deg) scale(0.4); }
        65%  { opacity: 1; transform: translate(8px, -4px) rotate(-8deg) scale(1.06); }
        85%  { transform: translate(-3px, 2px) rotate(3deg) scale(0.98); }
        100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    /* =========================================
       النصوص والنقاط
       ========================================= */
    .text-en {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: text-reveal 0.9s cubic-bezier(0.25, 1, 0.5, 1) 2.9s forwards;
    }

    .text-ar {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: text-reveal 0.9s cubic-bezier(0.25, 1, 0.5, 1) 3.2s forwards;
    }

    .dots {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: dots-pop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3.5s forwards;
    }

    @keyframes text-reveal {
        0%   { opacity: 0; transform: translateY(40px); filter: blur(6px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes dots-pop {
        0%   { opacity: 0; transform: scale(0) rotate(-45deg); }
        65%  { opacity: 1; transform: scale(1.35) rotate(8deg); }
        85%  { transform: scale(0.92) rotate(-3deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* =========================================
       Loading Text + Progress
       ========================================= */
    .loading-text {
        margin: 22px 0 0; font-size: 15px; font-weight: 700;
        color: var(--text-color); opacity: 0;
        animation: fade-in-text 0.7s ease-out 3.8s forwards;
    }
    .dots-anim { display: inline-block; margin-inline-start: 2px; }
    .dots-anim i { font-style: normal; opacity: 0; animation: dot-blink 1.4s ease-in-out infinite; }
    .dots-anim i:nth-child(1) { animation-delay: 0s; }
    .dots-anim i:nth-child(2) { animation-delay: 0.18s; }
    .dots-anim i:nth-child(3) { animation-delay: 0.36s; }

    @keyframes fade-in-text {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes dot-blink {
        0%, 20% { opacity: 0; } 50% { opacity: 1; } 80%, 100% { opacity: 0; }
    }

    .progress-track {
        margin-top: 18px; width: 180px; height: 4px;
        border-radius: 99px; background: rgba(5, 44, 81, 0.08);
        overflow: hidden; opacity: 0;
        animation: fade-in-text 0.7s ease-out 4.1s forwards;
    }
    .progress-bar {
        display: block; width: 45%; height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary-teal), var(--primary-orange));
        animation: indeterminate 1.7s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
    }
    @keyframes indeterminate {
        0%   { transform: translateX(320%); }
        100% { transform: translateX(-130%); }
    }

    /* =========================================
       Replay button
       ========================================= */
    .replay-btn {
        position: fixed; bottom: 22px; inset-inline-start: 22px;
        background: var(--primary-blue); color: #fff;
        border: 0; padding: 11px 20px; border-radius: 99px;
        font-family: inherit; font-size: 13px; font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(5, 44, 81, 0.28);
        transition: transform .25s ease, background .25s ease;
        z-index: 100;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .replay-btn:hover { background: var(--primary-teal); transform: translateY(-3px); }
    .replay-btn:active { transform: translateY(0) scale(.96); }
    .replay-btn svg { width: 14px; height: 14px; }

    @media (prefers-reduced-motion: reduce) {
        .top-gear-spin { animation-duration: 0.8s, 0.8s; }
        .gear-orange, .gear-teal { animation-duration: 0.8s; }
        .text-en, .text-ar { animation-duration: 0.5s; }
        .logo-svg { animation: logo-fade-in 0.4s ease-out both; }
    }
</style>
</head>
