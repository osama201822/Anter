<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="40%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <circle cx="400" cy="270" r="220" fill="#0d9488" opacity="0.12"/>
  <circle cx="400" cy="270" r="140" fill="#f59e0b" opacity="0.1"/>

  <g filter="url(#tileShadow)" transform="translate(400, 270)">
    <g stroke="#0f172a" stroke-width="4">
      <rect x="-170" y="-170" width="340" height="340" rx="16" fill="#1e293b" stroke="url(#goldRim)" stroke-width="3"/>
      <polygon points="0,-160 45,-45 160,0 45,45 0,160 -45,45 -160,0 -45,-45" fill="url(#terracottaGrad)"/>
      <polygon points="-113,-113 0,-70 113,-113 70,0 113,113 0,70 -113,113 -70,0" fill="url(#tealGrad)"/>
    </g>

    <g id="star8">
      <rect x="-95" y="-95" width="190" height="190" rx="8" fill="url(#ivoryGrad)" stroke="#0f172a" stroke-width="3"/>
      <rect x="-95" y="-95" width="190" height="190" rx="8" fill="url(#ivoryGrad)" stroke="#0f172a" stroke-width="3" transform="rotate(45)"/>
    </g>

    <circle cx="0" cy="0" r="62" fill="url(#tealGrad)" stroke="url(#goldRim)" stroke-width="4"/>
    <circle cx="0" cy="0" r="30" fill="url(#goldRim)" stroke="#78350f" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.8"/>
  </g>

  <rect x="180" y="510" width="440" height="55" rx="27" fill="#0f172a" stroke="url(#goldRim)" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="544" text-anchor="middle" fill="#fef3c7" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" font-weight="900">النجمة الثمانية والمقرنصات الأندلسية الفاخرة</text>
</svg>